name: Build Codex Quota Monitor macOS DMG

on:
  push:
    branches:
      - codex/build-quota-monitor-macos-v3
    paths:
      - "quota-monitor-macos/**"
      - ".github/workflows/build-quota-monitor-macos-v3.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }} DMG
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x64

    defaults:
      run:
        working-directory: quota-monitor-macos

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: quota-monitor-macos/package-lock.json

      - name: Restore app icon
        run: /usr/bin/base64 -D build/icon.png.b64 > build/icon.png

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build, sign and verify DMG
        run: bash scripts/build-dmg-ci.sh "${{ matrix.arch }}"

      - name: Upload split DMG
        uses: actions/upload-artifact@v4
        with:
          name: CodexQuotaMonitor-macOS-${{ matrix.arch }}-v3.0
          path: |
            quota-monitor-macos/output/*.part-*
            quota-monitor-macos/output/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  collect:
    name: Collect verified installers
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out build branch
        uses: actions/checkout@v4
        with:
          ref: codex/build-quota-monitor-macos-v3

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: CodexQuotaMonitor-macOS-*-v3.0
          path: quota-monitor-macos/ci-output
          merge-multiple: true

      - name: Commit verified split installers
        run: |
          set -euo pipefail
          find quota-monitor-macos/ci-output -maxdepth 1 -type f -print
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f quota-monitor-macos/ci-output
          git commit -m "build(mac): collect quota monitor DMGs [skip ci]"
          git push origin HEAD:codex/build-quota-monitor-macos-v3
