name: Build macOS DMG

on:
  push:
    branches:
      - codex/build-mac-dmg-v1.0.27
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }} DMG
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mac/package-lock.json

      - name: Install dependencies
        working-directory: mac
        run: npm ci

      - name: Run tests
        working-directory: mac
        run: npm test

      - name: Build and verify DMG
        working-directory: mac
        run: bash scripts/build-dmg.sh "${{ matrix.arch }}"

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: CodexLink-macOS-${{ matrix.arch }}-checksum
          path: mac/output/*.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Upload part aa
        uses: actions/upload-artifact@v4
        with:
          name: CodexLink-macOS-${{ matrix.arch }}-part-aa
          path: mac/output/*.part-aa
          if-no-files-found: error
          compression-level: 0

      - name: Upload part ab
        uses: actions/upload-artifact@v4
        with:
          name: CodexLink-macOS-${{ matrix.arch }}-part-ab
          path: mac/output/*.part-ab
          if-no-files-found: error
          compression-level: 0

      - name: Upload part ac
        uses: actions/upload-artifact@v4
        with:
          name: CodexLink-macOS-${{ matrix.arch }}-part-ac
          path: mac/output/*.part-ac
          if-no-files-found: error
          compression-level: 0

      - name: Upload part ad
        uses: actions/upload-artifact@v4
        with:
          name: CodexLink-macOS-${{ matrix.arch }}-part-ad
          path: mac/output/*.part-ad
          if-no-files-found: error
          compression-level: 0

      - name: Upload optional part ae
        uses: actions/upload-artifact@v4
        with:
          name: CodexLink-macOS-${{ matrix.arch }}-part-ae
          path: mac/output/*.part-ae
          if-no-files-found: ignore
          compression-level: 0
