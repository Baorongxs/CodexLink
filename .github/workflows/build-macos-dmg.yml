name: Build macOS DMG

on:
  push:
    branches:
      - codex/build-mac-dmg-v1.0.22
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }} DMG
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mac/package-lock.json

      - name: Install dependencies
        working-directory: mac
        run: npm ci

      - name: Run tests
        working-directory: mac
        run: npm test

      - name: Build and verify DMG
        working-directory: mac
        run: bash scripts/build-dmg.sh "${{ matrix.arch }}"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: CodexLink-macOS-${{ matrix.arch }}-v1.0.22
          path: |
            mac/output/*.dmg
            mac/output/*.sha256
          if-no-files-found: error
          compression-level: 0
